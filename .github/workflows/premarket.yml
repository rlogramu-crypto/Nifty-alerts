name: Pre-market
on:
  schedule:
    - cron: "0 3 * * 1-5"   # 8:30 AM IST, Mon-Fri (GitHub may start 10-30 min late)
  workflow_dispatch:
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fill_premarket.py
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
