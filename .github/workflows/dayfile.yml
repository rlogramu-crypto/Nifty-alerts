name: Day data file
on:
  schedule:                    # backup attempts; the scanner normally starts this itself right after the close
    - cron: "10 10 * * 1-5"    # 15:40 IST
    - cron: "40 10 * * 1-5"    # 16:10 IST
    - cron: "10 11 * * 1-5"    # 16:40 IST
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD (blank = today)"
        required: false
        default: ""
      from_time:
        description: "Optional window start HH:MM, e.g. 12:00"
        required: false
        default: ""
      to_time:
        description: "Optional window end HH:MM, e.g. 12:50"
        required: false
        default: ""
permissions:
  contents: write            # needed so the run can save the day's CSV into the repo (data/ folder)
jobs:
  check:                     # a schedule run does nothing if today's file is already saved
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.d.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          RUN=yes
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/nifty_$(TZ=Asia/Kolkata date +%F).csv" ]; then
            RUN=no
            echo "Today's file is already saved, so this run stops."
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
  dayfile:
    needs: check
    if: needs.check.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (for the candle video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: python day_file.py
        env:
          PYTHONUNBUFFERED: "1"
          DATE: ${{ inputs.date }}
          FROM_TIME: ${{ inputs.from_time }}
          TO_TIME: ${{ inputs.to_time }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day-data
          path: |
            nifty_*.csv
            nifty_*.mp4
          if-no-files-found: ignore
      - name: Save the day CSV in the repo for the month report
        run: |
          mkdir -p data
          cp nifty_*.csv data/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Add day data" && git pull --rebase && git push)
